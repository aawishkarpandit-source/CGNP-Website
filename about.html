<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>About Us | VELTRION</title>
  <meta name="description" content="Learn about VELTRION: our vision, team and how we help businesses. Engineered for What's Next.">
  <meta name="theme-color" content="#101412">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VELTRION">
  <meta property="og:title" content="About Us | VELTRION">
  <meta property="og:description" content="Learn about VELTRION: our vision, team and how we help businesses.">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="assets/img/logo.png" type="image/png">
  <script>
    /* Mark JS as available (gates reveal animations + hides the boot fallback),
       then arm the watchdog: if the page module never renders, drop the `js`
       class so the fallback below becomes visible. The page can degrade, but
       it never stays a blank screen. */
    document.documentElement.classList.add("js");
    setTimeout(function () {
      var app = document.getElementById("app");
      if (app && app.childElementCount === 0) {
        document.documentElement.classList.remove("js");
      }
    }, 3000);
  </script>
</head>
<body>
  <!-- Page content is rendered here by assets/js/compiled/pages/about.js -->
  <div id="app"></div>

  <!-- Boot fallback: visible whenever html has no `js` class — i.e. JS is
       disabled (<noscript> case) or the watchdog above fired because rendering
       failed. Same markup in all three shells. -->
  <div class="boot-fallback">
    <p class="boot-eyebrow">VELTRION</p>
    <h1>Engineered for What's Next.</h1>
    <p class="boot-tag">Websites, software, business systems, design, marketing and support.</p>
    <nav class="boot-nav" aria-label="Fallback navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="download.html">Our Work</a>
    </nav>
    <p class="boot-note">If this message stays, please enable JavaScript for the full site, or reload the page.</p>
  </div>

  <script type="module" src="assets/js/compiled/pages/about.js"></script>
</body>
</html>
